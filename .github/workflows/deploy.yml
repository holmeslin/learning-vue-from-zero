name: deployment
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 和 README.md 的版本保持一致，升版前先在本機建置確認
  MDBOOK_VERSION: "0.5.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL --fail --retry 3 --retry-delay 2 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check code examples
        run: |
          npm ci
          npm run check

      - name: Build Traditional Chinese edition
        working-directory: zh-TW
        run: |
          mdbook build
          (cd src && zip -r ../book/vue-book-src.zip .)

      - name: Assemble site
        run: |
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          cp zh-TW/book/404.html public/404.html
          cp -r zh-TW/book public/zh-TW

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
